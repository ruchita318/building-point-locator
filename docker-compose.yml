services:
  postgres:
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: building_locator
      POSTGRES_USER: locator
      POSTGRES_PASSWORD: locator_docker_password
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locator -d building_locator"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  app:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/building_locator
      DB_USERNAME: locator
      DB_PASSWORD: locator_docker_password
      DB_POOL_MAX_SIZE: 20
      DB_POOL_MIN_IDLE: 5
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SECURITY_ENABLED: "true"
      API_USERNAME: demo-api-user
      API_PASSWORD: demo-api-password
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]
    restart: unless-stopped
volumes:
  postgres-data:
