spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/building_locator}
    username: ${DB_USERNAME:locator}
    password: ${DB_PASSWORD:locator_local_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true

app:
  security:
    enabled: ${SECURITY_ENABLED:false}
    username: ${API_USERNAME:local-user}
    password: ${API_PASSWORD:local-password}

logging:
  level:
    root: INFO
    com.example.locator: DEBUG
    org.springframework.security: INFO
